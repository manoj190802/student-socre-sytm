<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Score System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
            color: #333;
        }

        input[type="text"],
        input[type="number"] {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"] {
            flex: 1;
            min-width: 150px;
        }

        input[type="number"] {
            width: 100px;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .subjects-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            animation: fadeIn 0.6s ease-out 0.3s both;
            font-size: 0.9rem;
            overflow-x: auto;
        }

        table thead {
            background: #667eea;
            color: white;
            position: sticky;
            top: 0;
        }

        table th,
        table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        table th:first-child,
        table td:first-child {
            text-align: left;
        }

        table tbody tr:hover {
            background: #f0f0f0;
            transition: background 0.2s;
        }

        .subject-score {
            background: #e3f2fd;
            border-radius: 5px;
            padding: 5px;
        }

        .subject-score.excellent {
            background: #c8e6c9;
        }

        .subject-score.good {
            background: #fff9c4;
        }

        .subject-score.average {
            background: #ffe0b2;
        }

        .subject-score.poor {
            background: #ffccbc;
        }

        .grade {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .grade-a {
            background: #28a745;
            color: white;
        }

        .grade-b {
            background: #ffc107;
            color: black;
        }

        .grade-c {
            background: #ff9800;
            color: white;
        }

        .grade-d {
            background: #ff5722;
            color: white;
        }

        .grade-f {
            background: #d32f2f;
            color: white;
        }

        .delete-btn {
            background: #ff5252;
            padding: 5px 10px;
            font-size: 0.9rem;
        }

        .delete-btn:hover {
            background: #d32f2f;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1rem;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #667eea;
            margin: 0;
        }

        .close-btn {
            font-size: 2rem;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }

        .close-btn:hover {
            color: #333;
        }

        .deleted-item {
            background: #fff3e0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #ff9800;
        }

        .deleted-item p {
            margin: 5px 0;
            color: #333;
        }

        .deleted-item-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .recover-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .recover-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .permanent-delete-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .permanent-delete-btn:hover {
            background: #b71c1c;
            transform: translateY(-2px);
        }

        .empty-trash {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Student Score System</h1>
            <p>Manage student scores across 5 subjects</p>
        </header>

        <div class="content">
            <div class="form-section">
                <div class="form-group">
                    <input type="text" id="studentName" placeholder="Student Name" />
                </div>
                <div class="subjects-row">
                    <div class="form-group">
                        <label>Tamil:</label>
                        <input type="number" id="tamil" placeholder="Score" min="0" max="100" />
                    </div>
                    <div class="form-group">
                        <label>English:</label>
                        <input type="number" id="english" placeholder="Score" min="0" max="100" />
                    </div>
                    <div class="form-group">
                        <label>Maths:</label>
                        <input type="number" id="maths" placeholder="Score" min="0" max="100" />
                    </div>
                    <div class="form-group">
                        <label>Science:</label>
                        <input type="number" id="science" placeholder="Score" min="0" max="100" />
                    </div>
                    <div class="form-group">
                        <label>Social Science:</label>
                        <input type="number" id="socialscience" placeholder="Score" min="0" max="100" />
                    </div>
                </div>
                <div class="form-group">
                    <button onclick="addStudent()">Add Student</button>
                    <button onclick="exportAsCSV()" style="background: #ff9800;">Export CSV</button>
                    <button onclick="importData()" style="background: #2196f3;">Import Data</button>
                    <button onclick="showDeletedData()" style="background: #9c27b0;">🗑️ Recover Deleted</button>
                    <button onclick="clearAllData()" style="background: #d32f2f;">Clear All</button>
                    <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="handleFileImport(event)" />
                </div>
            </div>

            <div id="tableContainer"></div>

            <div id="statsContainer"></div>
        </div>
    </div>

    <!-- Deleted Data Modal -->
    <div id="deletedModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🗑️ Recovered Data</h2>
                <button class="close-btn" onclick="closeDeletedModal()">&times;</button>
            </div>
            <div id="deletedList"></div>
        </div>
    </div>

    <script>
        const subjects = ['Tamil', 'English', 'Maths', 'Science', 'Social Science'];
        let students = JSON.parse(localStorage.getItem('students')) || [];
        let deletedStudents = JSON.parse(localStorage.getItem('deletedStudents')) || [];
        function displayStudents() {
            const tableContainer = document.getElementById('tableContainer');

            if (students.length === 0) {
                tableContainer.innerHTML = '<div class="empty-message">No students added yet. Add a student to get started!</div>';
                document.getElementById('statsContainer').innerHTML = '';
                return;
            }

            students.sort((a, b) => b.average - a.average);

            let tableHTML = `
                <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Name</th>
                            <th>Tamil</th>
                            <th>English</th>
                            <th>Maths</th>
                            <th>Science</th>
                            <th>Social Science</th>
                            <th>Total Score</th>
                            <th>Average</th>
                            <th>Grade</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            students.forEach((student, index) => {
                const grade = getGrade(student.average);
                const totalScore = student.tamil + student.english + student.maths + student.science + student.socialscience;
                tableHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${student.name}</td>
                        <td><span class="subject-score">${student.tamil}</span></td>
                        <td><span class="subject-score">${student.english}</span></td>
                        <td><span class="subject-score">${student.maths}</span></td>
                        <td><span class="subject-score">${student.science}</span></td>
                        <td><span class="subject-score">${student.socialscience}</span></td>
                        <td><strong style="color: #667eea; font-size: 1.1rem;">${totalScore}/500</strong></td>
                        <td><strong>${student.average.toFixed(2)}</strong></td>
                        <td><span class="grade grade-${grade.toLowerCase()}">${grade}</span></td>
                        <td><button class="delete-btn" onclick="deleteStudent('${student.id}')">Delete</button></td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table></div>';
            tableContainer.innerHTML = tableHTML;

            displayStats();
        }

        function getGrade(score) {
            if (score >= 90) return 'A';
            if (score >= 80) return 'B';
            if (score >= 70) return 'C';
            if (score >= 60) return 'D';
            return 'F';
        }

        function displayStats() {
            const statsContainer = document.getElementById('statsContainer');
            const averages = students.map(s => s.average);
            const overallAverage = averages.reduce((a, b) => a + b, 0) / averages.length;
            const highest = Math.max(...averages);
            const lowest = Math.min(...averages);

            statsContainer.innerHTML = `
                <div class="stats">
                    <div class="stat-card">
                        <h3>Total Students</h3>
                        <div class="value">${students.length}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Class Average</h3>
                        <div class="value">${overallAverage.toFixed(2)}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Highest Average</h3>
                        <div class="value">${highest.toFixed(2)}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Lowest Average</h3>
                        <div class="value">${lowest.toFixed(2)}</div>
                    </div>
                </div>
            `;
        }

        function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            const tamil = parseFloat(document.getElementById('tamil').value);
            const english = parseFloat(document.getElementById('english').value);
            const maths = parseFloat(document.getElementById('maths').value);
            const science = parseFloat(document.getElementById('science').value);
            const socialscience = parseFloat(document.getElementById('socialscience').value);

            if (!name) {
                alert('Please enter student name');
                return;
            }

            if (isNaN(tamil) || isNaN(english) || isNaN(maths) || isNaN(science) || isNaN(socialscience)) {
                alert('Please enter scores for all subjects (0-100)');
                return;
            }

            if (tamil < 0 || tamil > 100 || english < 0 || english > 100 ||
                maths < 0 || maths > 100 || science < 0 || science > 100 ||
                socialscience < 0 || socialscience > 100) {
                alert('Scores must be between 0-100');
                return;
            }

            const average = (tamil + english + maths + science + socialscience) / 5;

            const student = {
                id: Date.now().toString(),
                name,
                tamil,
                english,
                maths,
                science,
                socialscience,
                average
            };

            students.push(student);
            localStorage.setItem('students', JSON.stringify(students));

            document.getElementById('studentName').value = '';
            document.getElementById('tamil').value = '';
            document.getElementById('english').value = '';
            document.getElementById('maths').value = '';
            document.getElementById('science').value = '';
            document.getElementById('socialscience').value = '';

            displayStudents();
        }

        function deleteStudent(id) {
            const student = students.find(s => s.id === id);
            if (student) {
                deletedStudents.push(student);
                localStorage.setItem('deletedStudents', JSON.stringify(deletedStudents));
            }
            students = students.filter(s => s.id !== id);
            localStorage.setItem('students', JSON.stringify(students));
            displayStudents();
        }

        displayStudents();

        document.getElementById('socialscience').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addStudent();
        });

        function exportAsJSON() {
            if (students.length === 0) {
                alert('No data to export!');
                return;
            }

            const dataStr = JSON.stringify(students, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `students_${new Date().getTime()}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function exportAsCSV() {
            if (students.length === 0) {
                alert('No data to export!');
                return;
            }

            let csv = 'Rank,Name,Tamil,English,Maths,Science,Social Science,Total Score,Average,Grade\n';

            students.forEach((student, index) => {
                const grade = getGrade(student.average);
                const totalScore = student.tamil + student.english + student.maths + student.science + student.socialscience;
                csv += `${index + 1},"${student.name}",${student.tamil},${student.english},${student.maths},${student.science},${student.socialscience},${totalScore},${student.average.toFixed(2)},${grade}\n`;
            });

            const dataBlob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `students_${new Date().getTime()}.csv`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            document.getElementById('fileInput').click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const importedData = JSON.parse(e.target.result);

                    if (!Array.isArray(importedData)) {
                        alert('Invalid file format. Please select a valid JSON file.');
                        return;
                    }

                    students = importedData;
                    localStorage.setItem('students', JSON.stringify(students));
                    displayStudents();
                    alert('Data imported successfully!');
                    document.getElementById('fileInput').value = '';
                } catch (error) {
                    alert('Error reading file: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if (students.length === 0) {
                alert('No data to clear!');
                return;
            }

            if (confirm('Are you sure you want to delete all student data? This cannot be undone.')) {
                students = [];
                localStorage.removeItem('students');
                displayStudents();
                alert('All data cleared!');
            }
        }

        function loadSampleData() {
            const sampleStudents = [
                {
                    id: Date.now().toString() + '1',
                    name: 'Arjun Kumar',
                    tamil: 95,
                    english: 88,
                    maths: 92,
                    science: 90,
                    socialscience: 87,
                    average: (95 + 88 + 92 + 90 + 87) / 5
                },
                {
                    id: Date.now().toString() + '2',
                    name: 'Priya Sharma',
                    tamil: 88,
                    english: 92,
                    maths: 85,
                    science: 89,
                    socialscience: 91,
                    average: (88 + 92 + 85 + 89 + 91) / 5
                },
                {
                    id: Date.now().toString() + '3',
                    name: 'Rohan Patel',
                    tamil: 78,
                    english: 82,
                    maths: 88,
                    science: 85,
                    socialscience: 80,
                    average: (78 + 82 + 88 + 85 + 80) / 5
                },
                {
                    id: Date.now().toString() + '4',
                    name: 'Ananya Singh',
                    tamil: 92,
                    english: 90,
                    maths: 95,
                    science: 93,
                    socialscience: 89,
                    average: (92 + 90 + 95 + 93 + 89) / 5
                },
                {
                    id: Date.now().toString() + '5',
                    name: 'Vikram Reddy',
                    tamil: 85,
                    english: 78,
                    maths: 80,
                    science: 82,
                    socialscience: 86,
                    average: (85 + 78 + 80 + 82 + 86) / 5
                }
            ];

            students = sampleStudents;
            localStorage.setItem('students', JSON.stringify(students));
            displayStudents();
            alert('Sample data loaded! You can now see the system in action.');
        }

        function showDeletedData() {
            const modal = document.getElementById('deletedModal');
            const deletedList = document.getElementById('deletedList');

            if (deletedStudents.length === 0) {
                deletedList.innerHTML = '<div class="empty-trash">🗑️ No deleted data to recover</div>';
            } else {
                let html = '';
                deletedStudents.forEach(student => {
                    const totalScore = student.tamil + student.english + student.maths + student.science + student.socialscience;
                    const grade = getGrade(student.average);
                    html += `
                        <div class="deleted-item">
                            <p><strong>${student.name}</strong></p>
                            <p>Total Score: ${totalScore}/500 | Average: ${student.average.toFixed(2)} | Grade: ${grade}</p>
                            <div class="deleted-item-actions">
                                <button class="recover-btn" onclick="recoverStudent('${student.id}')">✓ Recover</button>
                                <button class="permanent-delete-btn" onclick="permanentlyDelete('${student.id}')">✕ Delete Permanently</button>
                            </div>
                        </div>
                    `;
                });
                deletedList.innerHTML = html;
            }
            modal.style.display = 'block';
        }

        function closeDeletedModal() {
            document.getElementById('deletedModal').style.display = 'none';
        }

        function recoverStudent(id) {
            const student = deletedStudents.find(s => s.id === id);
            if (student) {
                students.push(student);
                localStorage.setItem('students', JSON.stringify(students));
                deletedStudents = deletedStudents.filter(s => s.id !== id);
                localStorage.setItem('deletedStudents', JSON.stringify(deletedStudents));
                displayStudents();
                showDeletedData();
                alert(`${student.name} recovered successfully!`);
            }
        }

        function permanentlyDelete(id) {
            if (confirm('Are you sure? This cannot be undone.')) {
                deletedStudents = deletedStudents.filter(s => s.id !== id);
                localStorage.setItem('deletedStudents', JSON.stringify(deletedStudents));
                showDeletedData();
                alert('Student permanently deleted!');
            }
        }

        window.onclick = (event) => {
            const modal = document.getElementById('deletedModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        };
    </script>
</body>
</html>
